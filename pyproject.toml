# Package metadata and the installed browser-server entry point.
[project]
name = "echo_adventure"
version = "1"
description = "Shipbuilding Choose Your Own Adventure Game"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
echo-adventure = "echo_adventure.app:main"

# Include the maintained static UI alongside the Python package.
[tool.setuptools.package-data]
"echo_adventure.ui" = ["*.html", "*.css", "*.js"]

# setuptools builds both editable development installs and distributable wheels.
[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"
